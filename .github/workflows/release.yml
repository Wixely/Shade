name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the exact tag
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE) { throw 'Git init failed' }
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_REF
          if ($LASTEXITCODE) { throw 'Tag fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Checkout failed' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Tag commit mismatch' }
      - name: Install the pinned .NET SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -UseBasicParsing 'https://raw.githubusercontent.com/dotnet/install-scripts/47940ac9fc30a2f2dd19167165d0bb0774625f67/src/dotnet-install.ps1' -OutFile $installer
          $sdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $directory = Join-Path $env:RUNNER_TEMP 'shade-dotnet'
          & $installer -Version $sdk -InstallDir $directory -NoPath
          if ($LASTEXITCODE) { throw 'SDK installation failed' }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify tag and restore locked dependencies
        run: |
          [xml]$project = Get-Content src/Shade/Shade.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match the project version' }
          ./scripts/restore.ps1
      - name: Build and test
        run: |
          dotnet run --project tests/Shade.Tests -c Release --no-restore -- --mqtt
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Package Windows x64
        run: ./scripts/package-release.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          # Two Windows downloads: the proven untrimmed build and the smaller NativeAOT one beside it.
          $archive = "artifacts/release-assets/Shade-$version-win-x64.zip"
          $aot = "artifacts/release-assets/Shade-$version-win-x64-aot.zip"
          $checksums = 'artifacts/release-assets/SHA256SUMS.txt'
          foreach ($required in @($archive, $aot, $checksums)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing release asset: $required" }
          }
          $arguments = @('release', 'create', $tag, $archive, $aot, $checksums, '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--draft', '--title', "Shade $version", '--notes-file', "docs/release-$version.md")
          $prerelease = $version.Contains('-')
          if ($prerelease) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE) { throw 'Release creation/upload failed; any draft is retained for inspection' }
          # Stable versions become the repository's latest release; prereleases never do.
          $latest = if ($prerelease) { 'false' } else { 'true' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest=$latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
